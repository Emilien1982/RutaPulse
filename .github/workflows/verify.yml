name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      # Node 24 = current LTS (long-term support).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run verify

  zones:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zones
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            zones/requirements.txt
            zones/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # The summary line of pytest (with the number of tests) is also published as a public
      # annotation (GitHub logs need a login). The exit code of pytest is kept.
      - name: Lancer les tests
        run: |
          set -o pipefail
          status=0
          python -m pytest 2>&1 | tee "$RUNNER_TEMP/pytest.log" || status=$?
          summary=$(grep -E '^=+ .* in [0-9.]+s' "$RUNNER_TEMP/pytest.log" | tail -n 1 | sed -E 's/^=+ //; s/ =+$//')
          echo "::notice title=Tests zones::${summary:-aucune ligne de résumé pytest}"
          exit "$status"
