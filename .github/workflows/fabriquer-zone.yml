# Builds the package of one zone on a free GitHub machine, publishes it as a release,
# then updates the catalogue (ADR 0003, sections 3 and 4; ADR 0012).
name: Fabriquer une zone

on:
  workflow_dispatch:
    inputs:
      zone:
        description: "Identifiant de la zone, tel qu'écrit dans zones/zones.json"
        type: string
        required: true
        default: nancy
  # TEMPORARY, to remove after the merge into main. GitHub only allows a manual
  # start of a workflow that already exists on main (phase 1, risk 1): until then,
  # a push on the phase branch builds "nancy" so that the workflow can be tried.
  push:
    branches:
      - claude/phase-1-zones-73115d
    paths:
      - "zones/**"
      - ".github/workflows/fabriquer-zone.yml"

# The automatic GITHUB_TOKEN is the only credential (no secret): it creates releases.
permissions:
  contents: write

# One run at a time, never cancelled: two runs must not rewrite the catalogue together.
concurrency:
  group: fabriquer-zone
  cancel-in-progress: false

jobs:
  fabriquer:
    runs-on: ubuntu-24.04
    # Mac (10 cores): about 1.5 minutes. Large margin for 4 cores and slow downloads.
    timeout-minutes: 60
    env:
      ZONE: ${{ inputs.zone || 'nancy' }}
      GH_TOKEN: ${{ github.token }}
      TIMES: ${{ github.workspace }}/times.md
    steps:
      - uses: actions/checkout@v7

      # Ubuntu 24.04 (noble, universe) package versions, checked on 2026-10-21 in the
      # Launchpad archive: osmium-tool 1.16.0-1build1 and tippecanoe 2.49.0-1build1 (Published).
      - name: Installer osmium et tippecanoe
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool=1.16.0-1build1 tippecanoe=2.49.0-1build1
          osmium --version | head -1
          tippecanoe --version
          printf '| %s | %s s |\n' "Installer osmium et tippecanoe" "$SECONDS" >> "$TIMES"

      # go-pmtiles 1.31.2, Linux x86-64. The SHA-256 is the "digest" given by the GitHub API
      # for this release asset, and was recomputed on the downloaded file on 2026-10-21.
      - name: Installer pmtiles
        env:
          PMTILES_VERSION: "1.31.2"
          PMTILES_SHA256: "3ed7dbf4ec2e6dfe5e25b6f70d1ffc932729f93c86db353bf514dd71010a312f"
        run: |
          file="go-pmtiles_${PMTILES_VERSION}_Linux_x86_64.tar.gz"
          curl -fL -o "$RUNNER_TEMP/$file" "https://github.com/protomaps/go-pmtiles/releases/download/v${PMTILES_VERSION}/$file"
          echo "$PMTILES_SHA256  $RUNNER_TEMP/$file" | sha256sum -c -
          mkdir -p "$HOME/bin"
          tar -xzf "$RUNNER_TEMP/$file" -C "$HOME/bin" pmtiles
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/pmtiles" version

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: zones/requirements.txt
      - run: pip install -r zones/requirements.txt

      - name: Tirer les images Docker
        run: |
          docker pull ghcr.io/valhalla/valhalla:3.9.1
          docker pull ghcr.io/onthegomap/planetiler:0.10.2
          docker pull ghcr.io/osgeo/gdal:alpine-small-3.10.3
          printf '| %s | %s s |\n' "Tirer les images Docker" "$SECONDS" >> "$TIMES"

      # Big files that do not change from one run to the next: Planetiler annexes (1.4 GB)
      # and HGT tiles. Fixed key: change the "v1" to start again from an empty cache.
      # The OSM extract is NOT cached (it is kept outside this folder).
      - uses: actions/cache@v6
        with:
          path: zones/work/cache
          key: zones-cache-v1

      - name: Choisir la version
        id: version
        working-directory: zones
        run: |
          git ls-remote --tags origin 'refs/tags/zone-*' | sed 's#.*refs/tags/##' > "$RUNNER_TEMP/tags.txt"
          cat "$RUNNER_TEMP/tags.txt"
          version=$(python -m zonefactory next-version "$ZONE" < "$RUNNER_TEMP/tags.txt")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version : $version"

      - name: Fabriquer le paquet
        working-directory: zones
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # memory sampled every 5 s (MB used), to report the peak (risk 3)
          ( while true; do free -m | awk '/^Mem:/ {print $3}'; sleep 5; done > "$RUNNER_TEMP/mem.txt" ) &
          sampler=$!
          python -m zonefactory build "$ZONE" --version "$VERSION" --out "$RUNNER_TEMP/package"
          kill "$sampler" || true
          printf '| %s | %s s |\n' "Fabriquer le paquet" "$SECONDS" >> "$TIMES"
          {
            echo "peak_memory_mb=$(sort -n "$RUNNER_TEMP/mem.txt" | tail -1)"
            echo "disk_used=$(df -h / | awk 'NR==2 {print $3 " sur " $2}')"
            echo "work_size=$(du -sh work | cut -f1)"
          } > "$RUNNER_TEMP/measures.txt"

      - name: Publier la release de la zone
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["name"])' "$RUNNER_TEMP/package/zone.json")
          gh release create "zone-$ZONE-v$VERSION" --target "$GITHUB_SHA" \
            --title "Zone $name (v$VERSION)" \
            --notes "Paquet de la zone $name, version $VERSION. Fabriqué par GitHub Actions. Contrôle : sha256sum -c SHA256SUMS" \
            "$RUNNER_TEMP"/package/*
          printf '| %s | %s s |\n' "Publier la release" "$SECONDS" >> "$TIMES"

      # The catalogue lives in the release "catalogue". Only a missing release is created
      # (with an explicit empty catalogue); any other error stops the workflow.
      - name: Récupérer le catalogue actuel
        run: |
          mkdir -p "$RUNNER_TEMP/current"
          if gh release view catalogue > /dev/null 2> "$RUNNER_TEMP/view-error.txt"; then
            gh release download catalogue --pattern catalogue.json --dir "$RUNNER_TEMP/current" --clobber
          elif grep -q "release not found" "$RUNNER_TEMP/view-error.txt"; then
            echo "Release catalogue absente : création avec un catalogue vide."
            echo '{"formatVersion":1,"zones":[]}' > "$RUNNER_TEMP/current/catalogue.json"
            gh release create catalogue --target "$GITHUB_SHA" --title "Catalogue des zones" \
              --notes "Catalogue des zones disponibles. Remplacé à chaque publication d'une zone." \
              "$RUNNER_TEMP/current/catalogue.json"
          else
            cat "$RUNNER_TEMP/view-error.txt"
            exit 1
          fi
          cat "$RUNNER_TEMP/current/catalogue.json"

      - name: Mettre à jour le catalogue
        working-directory: zones
        run: |
          mkdir -p "$RUNNER_TEMP/new"
          python -m zonefactory catalogue --current "$RUNNER_TEMP/current/catalogue.json" \
            --package "$RUNNER_TEMP/package" --repo "$GITHUB_REPOSITORY" --out "$RUNNER_TEMP/new/catalogue.json"

      # Downloads the files just published and checks size and SHA-256 of each one.
      - name: Contrôler la release publiée
        working-directory: zones
        run: |
          python -m zonefactory verify --catalogue "$RUNNER_TEMP/new/catalogue.json" --zone "$ZONE" --dest "$RUNNER_TEMP/verified"
          printf '| %s | %s s |\n' "Contrôler la release publiée" "$SECONDS" >> "$TIMES"

      - name: Publier le catalogue
        run: gh release upload catalogue "$RUNNER_TEMP/new/catalogue.json" --clobber

      - name: Résumé
        if: always()
        run: |
          {
            echo "## Fabrication de la zone $ZONE"
            if [ -f "$RUNNER_TEMP/package/zone.json" ]; then
              python - "$RUNNER_TEMP/package/zone.json" <<'PY'
          import json, os, sys
          z = json.load(open(sys.argv[1]))
          print(f"- Version : {z['version']}")
          print(f"- Date des données (osmDate) : {z['osmDate']}")
          print(f"- Extrait OSM daté (pour le contrôle C7) : {z['osmExtract']['url']}")
          print(f"- MD5 de l'extrait : {z['osmExtract']['md5']}")
          print("- Outils : " + ", ".join(f"{k} {v}" for k, v in z["tools"].items()))
          print("\n| Fichier | Octets |\n|---|---|")
          folder = os.path.dirname(sys.argv[1])
          for name in sorted(os.listdir(folder)):
              print(f"| {name} | {os.path.getsize(os.path.join(folder, name))} |")
          PY
            fi
            if [ -f "$RUNNER_TEMP/measures.txt" ]; then
              echo
              echo "- Mémoire au plus haut : $(grep peak_memory_mb "$RUNNER_TEMP/measures.txt" | cut -d= -f2) Mo"
              echo "- Disque utilisé : $(grep disk_used "$RUNNER_TEMP/measures.txt" | cut -d= -f2)"
              echo "- Dossier de travail : $(grep work_size "$RUNNER_TEMP/measures.txt" | cut -d= -f2)"
            fi
            if [ -f "$TIMES" ]; then
              echo
              echo "| Étape | Durée |"
              echo "|---|---|"
              cat "$TIMES"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
