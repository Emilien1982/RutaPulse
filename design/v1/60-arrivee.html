<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>RutaPulse v1 – Arrivée</title>
<!--
  Écran 60, v1, style années 70. Décisions 4 et 5 (questions) et 4 (style) :
  écran « Arrivé » avec un résumé, et arrêt du suivi ; dans le style des années
  70, car c'est un moment de fête.
  Instant montré : le suivi vient de détecter l'arrivée au bout de « Boucle du
  Bois de la Côte ». Le suivi est arrêté (GPS coupé, notification retirée).
  Illustration fixe en v1 : c'est la dernière image de l'animation prévue en V2
  (le vététiste couvert de boue monte sur le podium et brandit un trophée). En
  V2, on anime les mêmes groupes jusqu'à cette pose ; rien à redessiner.
  Titre « ARRIVÉE ! » : le nom, comme sur une banderole d'arrivée (validé le
  21 octobre 2026).
  Chiffres réels (décision du 21 octobre 2026) : distance et D+ réellement
  parcourus pendant le suivi, durée réelle du « Démarrer le suivi » à
  l'arrivée. Ils diffèrent donc de ceux de l'itinéraire prévu (25,1 km,
  421 m, 1 h 35 sur l'écran 40) : c'est voulu. Libellé « Distance parcourue »
  pour le dire sans phrase de plus.
  Pas de bouton « Continuer le suivi » (décision du 21 octobre 2026) : un seul
  bouton, « Fermer ».
  Lu sur le guidon, à l'arrêt : chiffres en 36 (comme « Reste » sur le suivi),
  bouton de 64 de haut (gants).
  Pose du vététiste « podium » : bras avant levé à 50° vers l'avant (au-delà, il
  passerait devant le visage), bras arrière levé derrière la tête.
  Valeurs : design/tokens.md.
-->
<style>
:root{
  --creme:#F4E4C1; --creme-clair:#FBF1DA; --brun:#3A1F0F; --brun-2:#5A3A28;
  --moutarde:#F0A830; --moutarde-pale:#F6CB7A; --orange:#E2652B; --rouille:#B5452A; --petrole:#2D6A66;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:var(--creme)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,"Segoe UI",system-ui,sans-serif;color:var(--brun);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.geo{font-family:"Futura","Futura PT",Jost,"Century Gothic","Avenir Next",sans-serif;font-weight:700}
.ecran{position:relative;width:390px;height:844px;overflow:hidden;background:var(--creme)}
.barre-etat{position:absolute;top:0;left:0;right:0;height:47px;display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 34px;font-size:16px;font-weight:600;z-index:20;color:var(--brun)}
.barre-etat .icones{display:flex;gap:6px;align-items:center}
.indicateur{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--brun);z-index:30}

.illustration{position:absolute;top:47px;left:0}
h1{position:absolute;top:384px;left:0;right:0;text-align:center;font-size:44px;line-height:1.15;letter-spacing:2px}
.nom{position:absolute;top:440px;left:24px;right:24px;text-align:center;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.resume{position:absolute;top:476px;left:16px;right:16px;background:var(--creme-clair);border:2.5px solid var(--brun);border-radius:22px;overflow:hidden}
.resume .ligne{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 18px 0 24px;border-top:2px solid rgba(58,31,15,.22)}
.resume .ligne:first-child{border-top:0}
.resume .e{font-size:17px;font-weight:600;color:var(--brun-2)}
.resume .v{font-size:36px;font-weight:800;line-height:1}
.resume .v u{text-decoration:none;font-size:20px;font-weight:700}

.note{position:absolute;top:662px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:6px;font-size:15px;color:var(--brun-2)}
.principal{position:absolute;top:698px;left:16px;right:16px;height:64px;border-radius:32px;background:var(--brun);color:var(--creme);font-size:20px;display:flex;align-items:center;justify-content:center;gap:10px}
</style>
</head>
<body>
<div class="ecran">

<div class="barre-etat"><span>11:16</span>
  <span class="icones">
    <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1" opacity=".3"/><rect x="15" y="0" width="3" height="12" rx="1" opacity=".3"/></svg>
    <svg width="27" height="12" viewBox="0 0 27 12" fill="currentColor"><rect x=".5" y=".5" width="23" height="11" rx="3" fill="none" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="10" height="8" rx="1.5"/><rect x="25" y="4" width="2" height="4" rx="1" opacity=".5"/></svg>
  </span>
</div>

<svg class="illustration" width="390" height="330" viewBox="0 0 390 330" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

    <polygon points="195,250 -115.2,137.1 -90.8,85"/>
    <polygon points="195,250 -57.8,37.8 -17.2,-2.8"/>

    <polygon points="195,250 137.6,-75.1 195,-80"/>
    <polygon points="195,250 252.4,-75.1 307.9,-60.2"/>
    <polygon points="195,250 360,-35.8 407.2,-2.8"/>
    <polygon points="195,250 447.8,37.8 480.8,85"/>
    <polygon points="195,250 505.2,137.1 520.1,192.6"/>

  <rect x="0" y="308" width="390" height="9" fill="#B5452A"/>
  <rect x="0" y="317" width="390" height="13" fill="#3A1F0F"/>

  <!-- Vélo garé derrière la marche n° 2, origine au pédalier -->
  <g class="velo" transform="translate(78 262)">
    <g class="roue roue-arriere" transform="translate(-42 -2)">

      <g stroke="#5A3A28" stroke-width="2"><line x1="-24" x2="24"/><line x1="-12" y1="-20.8" x2="12" y2="20.8"/><line x1="-12" y1="20.8" x2="12" y2="-20.8"/></g>

    </g>

      <circle r="3.5" fill="#3A1F0F"/>

    <path class="cadre" d="M-42 -2 L0 0 L-10 -42 Z M-10 -42 L48 -46 L51 -34 L0 0" fill="none" stroke="#2D6A66" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <g class="boue" fill="#7A4A1E"><ellipse cx="-24" cy="-4" rx="5" ry="3"/><ellipse cx="20" cy="-44" rx="4" ry="2.5"/><circle cx="-6" cy="-24" r="2.5"/></g>

  <!-- Podium : 2, 1, 3 -->
  <g class="podium" stroke="#3A1F0F" stroke-width="3" stroke-linejoin="round">

  </g>
  <g class="numeros" fill="#FBF1DA" stroke="#3A1F0F" stroke-width="2.5">
    <circle cx="195" cy="246" r="14"/><circle cx="115" cy="265" r="13"/><circle cx="275" cy="273" r="12"/>
  </g>
  <g font-family="Futura,'Futura PT',Jost,'Century Gothic',sans-serif" font-weight="700" fill="#3A1F0F" text-anchor="middle">
    <text x="195" y="252.5" font-size="18">1</text><text x="115" y="271" font-size="17">2</text><text x="275" y="278.5" font-size="15">3</text>
  </g>

  <!-- Vététiste couvert de boue, origine à la hanche, debout sur la marche n° 1 (y 217 = hanche + 77). Pose « podium ». -->

    <g class="buste">

        <g stroke="#3A1F0F" stroke-width="2.2" stroke-linecap="round" fill="none">

          <path d="M-10 -25 q-7 0 -7 6 q0 5 7 5"/><path d="M10 -25 q7 0 7 6 q0 5 -7 5"/>
        </g>
        <path d="M-10 -29 H10 Q10 -11 0 -11 Q-10 -11 -10 -29 Z" fill="#F0A830" stroke="#3A1F0F" stroke-width="2.2" stroke-linejoin="round"/>
        <rect x="-2" y="-11" width="4" height="8" fill="#F0A830" stroke="#3A1F0F" stroke-width="1.6"/>
        <rect x="-8" y="-4" width="16" height="5" rx="1" fill="#3A1F0F"/>
      </g>
      <g class="bras" transform="translate(0 -34) rotate(-130)">
        <line y2="20" stroke="#D9956A" stroke-width="7" stroke-linecap="round"/>
        <g class="avant-bras" transform="translate(0 20) rotate(-10)">

        <g class="boue" fill="#7A4A1E"><ellipse cx="1" cy="17" rx="4.5" ry="7"/><circle cx="-2" cy="29" r="2.5"/></g>
        <ellipse class="chaussure" cx="4" cy="37" rx="8" ry="4.5" fill="#3A1F0F"/>

</svg>

<h1 class="geo">ARRIVÉE !</h1>
<div class="nom">Boucle du Bois de la Côte</div>

<div class="resume" role="list" aria-label="Résumé de la sortie">

  <div class="ligne" role="listitem" style="box-shadow:inset 9px 0 0 var(--orange)"><span class="e">Montée (D+)</span><span class="v">433<u> m</u></span></div>
  <div class="ligne" role="listitem" style="box-shadow:inset 9px 0 0 var(--rouille)"><span class="e">Durée</span><span class="v">1<u> h </u>52</span></div>
</div>

<div class="note"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A3A28" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>Le suivi est arrêté.</div>
<div class="principal geo">Fermer</div>

<div class="indicateur"></div>
</div>
</body>
</html>
