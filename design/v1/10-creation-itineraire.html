<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>RutaPulse v1 – Créer un itinéraire : déplacer un point, recalcul en direct</title>
<!--
  Écran 10, v1, style années 70. Même contenu que design/10-creation-itineraire.html.
  Fonctions 2 et 9 du cadrage ; décision 6 (bouton « Boucler » : ajoute le départ
  comme dernier point).
  Instant montré : on glisse le point 2 ; l'itinéraire et les chiffres du bas se
  recalculent pendant le geste. Le point glissé est dessiné au-dessus du doigt.
  La carte, les tracés et les marqueurs ne changent pas : ce sont ceux du suivi
  (jetons carte.*, trace.*, marqueur.*). Seuls la barre du haut, les boutons
  posés sur la carte et la feuille du bas prennent le style.
  Chiffres en police du système (800, chiffres tabulaires) : ils changent pendant
  le geste et ce sont les mêmes que sur l'écran de suivi.
  Valeurs : design/tokens.md. Carte : dessin simplifié en SVG.
-->
<style>
:root{
  --creme:#F4E4C1; --creme-clair:#FBF1DA; --brun:#3A1F0F; --brun-2:#5A3A28;
  --moutarde:#F0A830; --orange:#E2652B; --rouille:#B5452A; --danger:#8A1C12;
  --ombre:0 2px 8px rgba(58,31,15,.30);
  --itineraire:#C2007A; --circuit:#2F6BFF; --depart:#146C2E;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:var(--creme)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,"Segoe UI",system-ui,sans-serif;color:var(--brun);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.geo{font-family:"Futura","Futura PT",Jost,"Century Gothic","Avenir Next",sans-serif;font-weight:700}
.ecran{position:relative;width:390px;height:844px;overflow:hidden}
svg.carte{position:absolute;left:0;top:0;width:390px;height:844px}
svg.carte *{vector-effect:non-scaling-stroke}
.barre-etat{position:absolute;top:0;left:0;right:0;height:47px;display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 34px;font-size:16px;font-weight:600;z-index:20;color:var(--brun)}
.barre-etat .icones{display:flex;gap:6px;align-items:center}
.indicateur{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--brun);z-index:30}

/* Barre du haut : crème, puis les trois rayures */
.barre-haut{position:absolute;top:0;left:0;right:0;height:112px;background:var(--creme);z-index:10}
.barre-haut .contenu{position:absolute;top:47px;left:0;right:0;height:56px;display:flex;align-items:center;gap:4px;padding:0 8px 0 4px}
.barre-haut .titre{flex:1;font-size:18px;line-height:1.2}
.rayures{position:absolute;left:0;right:0;bottom:0;height:9px;background:linear-gradient(var(--moutarde) 0 3px,var(--orange) 3px 6px,var(--rouille) 6px 9px)}
.icone-btn{width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:24px}
.enregistrer{height:48px;padding:0 18px;border-radius:24px;background:var(--moutarde);border:2.5px solid var(--brun);display:flex;align-items:center;font-size:17px}

/* Boutons posés sur la carte */
.flottant{position:absolute;right:16px;width:48px;height:48px;border-radius:24px;background:var(--creme-clair);border:2.5px solid var(--brun);box-shadow:var(--ombre);display:flex;align-items:center;justify-content:center}
.flottant .pastille{position:absolute;top:6px;right:6px;width:11px;height:11px;border-radius:6px;background:var(--circuit);border:2px solid var(--creme-clair)}

.bulle{position:absolute;top:124px;left:50%;transform:translateX(-50%);background:var(--brun);color:var(--creme);font-size:15px;font-weight:600;padding:10px 18px;border-radius:20px;white-space:nowrap;box-shadow:var(--ombre)}

/* Marqueurs : jetons marqueur.*, identiques au suivi */
.marqueur{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:50%;font-weight:800;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.point{width:28px;height:28px;margin:-14px 0 0 -14px;background:#fff;border:3px solid var(--itineraire);font-size:15px;color:#111}
.point.deplace{width:40px;height:40px;margin:-20px 0 0 -20px;font-size:18px;box-shadow:0 0 0 8px rgba(194,0,122,.22),0 6px 12px rgba(0,0,0,.35)}
.depart{width:32px;height:32px;margin:-16px 0 0 -16px;background:var(--depart);border:3px solid #fff}
.arrivee{width:32px;height:32px;margin:-16px 0 0 -16px;background:#111;border:3px solid #fff}
.doigt{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(58,31,15,.18);border:2px solid rgba(58,31,15,.35)}
.attribution{position:absolute;left:8px;top:556px;font-size:11px;color:var(--brun-2);background:rgba(251,241,218,.88);padding:1px 5px;border-radius:4px}

/* Feuille du bas */
.feuille{position:absolute;left:0;right:0;top:578px;bottom:0;background:var(--creme);border:3px solid var(--brun);border-bottom:0;border-radius:28px 28px 0 0;box-shadow:0 -2px 10px rgba(58,31,15,.22);padding:13px 13px 0}
.resume{display:flex;align-items:center;gap:16px;padding-left:3px}
.chiffre{flex:none}
.chiffre .v{font-size:28px;font-weight:800;line-height:1.15;white-space:nowrap}
.chiffre u{text-decoration:none;font-size:17px;font-weight:700}
.chiffre .e{font-size:13px;font-weight:600;color:var(--brun-2)}
.details{margin-left:auto;width:48px;height:48px;border-radius:24px;background:var(--creme-clair);border:2.5px solid var(--brun);display:flex;align-items:center;justify-content:center;flex:none}
.surtitre{font-size:13px;letter-spacing:1.2px;color:var(--brun-2);margin:13px 0 6px 3px}
.segments{display:flex;height:48px;border:2.5px solid var(--brun);border-radius:24px;overflow:hidden;background:var(--creme-clair)}
.segments div{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:600}
.segments .choisi{background:var(--brun);color:var(--creme)}
.outils{display:flex;gap:8px;margin-top:10px}
.outil{flex:1;height:56px;border-radius:18px;background:var(--creme-clair);border:2.5px solid var(--brun);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:15px;font-weight:600}
.outil.danger{color:var(--danger)}
</style>
</head>
