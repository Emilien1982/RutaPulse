<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>RutaPulse v1 – Carte, aucune zone téléchargée</title>
<!--
  Écran 91, v1, style années 70. Phase 2 (carte hors ligne), tâche T0.
  État vide de l'onglet Carte. Fonction 6 du cadrage ; décision 3 (le
  vététiste sur les états vides).
  Instant montré : premier lancement, aucune zone sur le téléphone, aucune
  en cours de téléchargement. La carte n'a rien à montrer : cet écran la
  remplace.
  - Même mise en page que l'écran 51 (grand soleil rayé, pas de titre en
    capitales, barre d'onglets) : on passe de 91 à 51 puis à la carte (90)
    sans que l'écran saute.
  - Le vététiste reprend exactement la pose « carte vierge » de l'écran 50
    (debout, il regarde une carte vide) : pas de nouvelle illustration en v1
    (décision 6, « le minimum »). Même groupe SVG, seulement déplacé.
  - Un seul bouton, principal : « Choisir une zone ». Il ouvre l'onglet
    Zones (écran 41), où l'on voit la taille de chaque zone avant de la
    télécharger. Le libellé dit ce qui se passe : on choisit, on ne lance
    pas un téléchargement de 100 Mo d'un seul geste.
  - Pas de bouton « Recentrer » ni d'attributions : il n'y a pas de carte.

  Autres états de l'onglet Carte, sans zone prête :
  - une zone se télécharge : écran 51 ;
  - une zone attend le Wi-Fi : écran 51, barre arrêtée, texte « En attente
    du Wi-Fi » et icône pause, comme la ligne Metz de l'écran 41.
  Dès qu'une zone est prête : écran 90.

  Le personnage : règle complète dans design/tokens.md, « Personnage ».
  Valeurs : design/tokens.md.
-->
<style>
:root{
  --creme:#F4E4C1; --creme-clair:#FBF1DA; --brun:#3A1F0F; --brun-2:#5A3A28;
  --moutarde:#F0A830; --orange:#E2652B; --rouille:#B5452A; --olive:#A9B56A;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:var(--creme)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,"Segoe UI",system-ui,sans-serif;color:var(--brun);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.geo{font-family:"Futura","Futura PT",Jost,"Century Gothic","Avenir Next",sans-serif;font-weight:700}
.ecran{position:relative;width:390px;height:844px;overflow:hidden;background:var(--creme)}
.barre-etat{position:absolute;top:0;left:0;right:0;height:47px;display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 34px;font-size:16px;font-weight:600;z-index:20;color:var(--brun)}
.barre-etat .icones{display:flex;gap:6px;align-items:center}
.indicateur{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--creme);z-index:30}

.illustration{position:absolute;top:47px;left:0}
.vide{position:absolute;top:484px;left:24px;right:24px;text-align:center}
.vide h1{font-size:24px;line-height:1.2}
.vide p{font-size:17px;line-height:1.4;color:var(--brun-2);margin-top:8px}
.principal{position:absolute;top:600px;left:55px;right:55px;height:56px;border-radius:28px;background:var(--brun);color:var(--creme);font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px;padding-left:4px}
.principal .soleil{width:32px;height:32px;border-radius:16px;background:var(--moutarde);display:flex;align-items:center;justify-content:center}

.rayures-bas{position:absolute;left:0;right:0;bottom:83px;height:9px;background:linear-gradient(var(--moutarde) 0 3px,var(--orange) 3px 6px,var(--rouille) 6px 9px)}
.onglets{position:absolute;left:0;right:0;bottom:0;height:83px;background:var(--brun);display:flex;padding-top:7px}
.onglet{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;font-weight:500;color:var(--creme)}
.pastille{width:64px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.onglet.actif{font-weight:800}
.onglet.actif .pastille{background:var(--moutarde);color:var(--brun)}
</style>
</head>
<body>
<div class="ecran">

<div class="barre-etat"><span>09:05</span>
  <span class="icones">
    <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity=".3"/></svg>
    <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 11.5L.5 3.2C2.6 1.5 5.2.5 8 .5s5.4 1 7.5 2.7z"/></svg>
    <svg width="27" height="12" viewBox="0 0 27 12" fill="currentColor"><rect x=".5" y=".5" width="23" height="11" rx="3" fill="none" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="19" height="8" rx="1.5"/><rect x="25" y="4" width="2" height="4" rx="1" opacity=".5"/></svg>
  </span>
</div>

<svg class="illustration" width="390" height="425" viewBox="0 0 390 425" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <!-- Grand soleil rayé sur quatre bandes (comme l'écran 51), un peu plus petit -->
  <defs><clipPath id="ciel"><rect x="0" y="0" width="390" height="220"/></clipPath></defs>
  <g clip-path="url(#ciel)">
    <circle cx="195" cy="220" r="90" fill="#F0A830"/>
    <rect x="90" y="172" width="210" height="4" fill="#F4E4C1"/>
    <rect x="90" y="187" width="210" height="6" fill="#F4E4C1"/>
    <rect x="90" y="203" width="210" height="7" fill="#F4E4C1"/>
  </g>
  <rect x="0" y="220" width="390" height="9" fill="#F0A830"/>
  <rect x="0" y="229" width="390" height="9" fill="#E2652B"/>
  <rect x="0" y="238" width="390" height="9" fill="#B5452A"/>
  <rect x="0" y="247" width="390" height="9" fill="#3A1F0F"/>
  <!-- Petites collines au loin -->
  <path d="M0 290 C40 274 80 274 120 286 C160 298 200 290 240 280 C290 268 340 276 390 288 V296 H0 Z" fill="#A9B56A" opacity=".55"/>

  <!-- Le groupe de l'écran 50, déplacé de 236 vers le bas : sol, vélo, vététiste « carte vierge » -->
  <g transform="translate(0 236)">
    <!-- Sol -->
    <rect x="64" y="176" width="262" height="9" rx="4.5" fill="#A9B56A"/>
    <g fill="none" stroke="#A9B56A" stroke-width="3" stroke-linecap="round">
      <path d="M80 176 l-3 -8 M86 176 l0 -10 M92 176 l3 -8"/>
      <path d="M300 176 l-3 -7 M306 176 l0 -9 M312 176 l3 -7"/>
    </g>

    <!-- Vélo, origine au pédalier -->
    <g class="velo" transform="translate(204 148)">
      <g class="manivelle-loin" transform="rotate(200)"><line x2="13" stroke="#5A3A28" stroke-width="4" stroke-linecap="round"/></g>
      <g class="roue roue-arriere" transform="translate(-42 -2)">
        <circle r="27" fill="none" stroke="#3A1F0F" stroke-width="6"/>
        <g stroke="#5A3A28" stroke-width="2"><line x1="-24" x2="24"/><line x1="-12" y1="-20.8" x2="12" y2="20.8"/><line x1="-12" y1="20.8" x2="12" y2="-20.8"/></g>
        <circle r="3.5" fill="#3A1F0F"/>
      </g>
      <g class="roue roue-avant" transform="translate(62 -2)">
        <circle r="27" fill="none" stroke="#3A1F0F" stroke-width="6"/>
        <g stroke="#5A3A28" stroke-width="2"><line x1="-24" x2="24"/><line x1="-12" y1="-20.8" x2="12" y2="20.8"/><line x1="-12" y1="20.8" x2="12" y2="-20.8"/></g>
        <circle r="3.5" fill="#3A1F0F"/>
      </g>
      <path class="cadre" d="M-42 -2 L0 0 L-10 -42 Z M-10 -42 L48 -46 L51 -34 L0 0" fill="none" stroke="#2D6A66" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="fourche" d="M51 -34 L62 -2" stroke="#5A3A28" stroke-width="5" stroke-linecap="round"/>
      <path class="tige-selle" d="M-10 -42 L-12 -51" stroke="#3A1F0F" stroke-width="4"/>
      <path class="selle" d="M-22 -53 L-3 -53" stroke="#3A1F0F" stroke-width="5" stroke-linecap="round"/>
      <path class="guidon" d="M48 -46 L50 -55 L43 -57" fill="none" stroke="#3A1F0F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle class="plateau" r="7" fill="#FBF1DA" stroke="#3A1F0F" stroke-width="2.5"/>
      <g class="manivelle" transform="rotate(20)"><line x2="13" stroke="#3A1F0F" stroke-width="4" stroke-linecap="round"/><g transform="translate(13 0) rotate(-20)"><rect x="-5" y="-2.5" width="10" height="5" rx="2" fill="#3A1F0F"/></g></g>
    </g>

    <!-- Vététiste, origine à la hanche. Pose « carte vierge » (écran 50). -->
    <g class="vetetiste" transform="translate(114 100)">
      <g class="jambe-loin" transform="rotate(8)">
        <line y2="36" stroke="#5A3A28" stroke-width="10" stroke-linecap="round"/>
        <g class="tibia" transform="translate(0 36) rotate(-4)">
          <line y2="36" stroke="#B97A52" stroke-width="8" stroke-linecap="round"/>
          <ellipse class="chaussure" cx="4" cy="37" rx="8" ry="4.5" fill="#5A3A28"/>
        </g>
      </g>
      <g class="buste" transform="rotate(3)">
        <g class="bras-loin" transform="translate(0 -34) rotate(-25)">
          <line y2="20" stroke="#B97A52" stroke-width="7" stroke-linecap="round"/>
          <g class="avant-bras" transform="translate(0 20) rotate(-85)">
            <line y2="18" stroke="#B97A52" stroke-width="6" stroke-linecap="round"/>
            <circle class="gant" cy="19" r="4.5" fill="#5A3A28"/>
          </g>
          <circle class="manche" cy="2" r="6.5" fill="#8E3520"/>
        </g>
        <rect class="maillot" x="-9" y="-40" width="18" height="44" rx="9" fill="#B5452A"/>
        <rect class="bande" x="-9" y="-25" width="18" height="5" fill="#F0A830"/>
        <g class="tete" transform="translate(0 -40) rotate(15)">
          <circle cy="-12" r="12" fill="#D9956A"/>
          <path class="casque" d="M-13.5 -13 A13.5 13.5 0 0 1 13.5 -13 Z" fill="#F0A830"/>
          <path class="visiere" d="M12 -14 L21 -12 L12.5 -10 Z" fill="#E2652B"/>
          <circle class="oeil" cx="6.5" cy="-9.5" r="1.8" fill="#3A1F0F"/>
          <path class="bouche" d="M4.5 -4 h5" fill="none" stroke="#3A1F0F" stroke-width="1.6" stroke-linecap="round"/>
        </g>
        <g class="accessoire carte-vierge">
          <path d="M20 -46 L54 -40 L52 -12 L18 -18 Z" fill="#FBF1DA" stroke="#3A1F0F" stroke-width="2.2" stroke-linejoin="round"/>
          <path d="M31 -44 L29 -16 M42 -42 L40 -14" stroke="#5A3A28" stroke-width="1.4" stroke-dasharray="3 2.5"/>
        </g>
        <g class="bras" transform="translate(0 -34) rotate(-37)">
          <line y2="20" stroke="#D9956A" stroke-width="7" stroke-linecap="round"/>
          <g class="avant-bras" transform="translate(0 20) rotate(-70)">
            <line y2="18" stroke="#D9956A" stroke-width="6" stroke-linecap="round"/>
            <circle class="gant" cy="19" r="4.5" fill="#3A1F0F"/>
          </g>
          <circle class="manche" cy="2" r="6.5" fill="#B5452A"/>
        </g>
      </g>
      <g class="jambe" transform="rotate(-6)">
        <line y2="36" stroke="#3A1F0F" stroke-width="10" stroke-linecap="round"/>
        <g class="tibia" transform="translate(0 36) rotate(8)">
          <line y2="36" stroke="#D9956A" stroke-width="8" stroke-linecap="round"/>
          <ellipse class="chaussure" cx="4" cy="37" rx="8" ry="4.5" fill="#3A1F0F"/>
        </g>
      </g>
    </g>
  </g>
</svg>

<div class="vide">
  <h1 class="geo">Pas encore de carte</h1>
  <p>Téléchargez une zone pour voir les sentiers, même sans réseau.</p>
</div>
<div class="principal geo" role="button"><span class="soleil"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3A1F0F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></span>Choisir une zone</div>

<div class="rayures-bas"></div>
<div class="onglets">
  <div class="onglet actif" aria-current="page"><span class="pastille"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg></span>Carte</div>
  <div class="onglet"><span class="pastille"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.5" fill="currentColor"/><circle cx="4.5" cy="12" r="1.5" fill="currentColor"/><circle cx="4.5" cy="18" r="1.5" fill="currentColor"/></svg></span>Itinéraires</div>
  <div class="onglet"><span class="pastille"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></span>Zones</div>
  <div class="onglet"><span class="pastille"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="8.6" stroke-width="3.2" stroke-dasharray="3.4 3.35"/><circle cx="12" cy="12" r="6" stroke-width="3.4"/></svg></span>Réglages</div>
</div>

<div class="indicateur"></div>
</div>
</body>
</html>
