<!-- RutaPulse, icon A, Android adaptive icon: foreground layer, transparent
     outside the drawing. 108 x 108 dp, render at 1024 px.
     Safe zone (circle of 66 dp, centre 54 54): the sun and the horizon fit in
     it (farthest point of the sun: 25.3 from the centre, limit 33).
     The three bands, the ground and the path are flat areas that run to the
     edges on purpose: they fill any launcher mask (circle, squircle, square)
     and the parallax shift. Same shapes as the symbol "icone-a" of
     design/v1/70-icone.html; the two cream lines of the sky are gaps here,
     the background layer shows through (same colour). -->
