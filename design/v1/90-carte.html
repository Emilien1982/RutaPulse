<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>RutaPulse v1 – Carte, une zone téléchargée</title>
<!--
  Écran 90, v1. Phase 2 (carte hors ligne), tâche T0. Fonctions 1 et 6 du
  cadrage ; décisions 8 (zoom jusqu'à 18) et 13 (IGN dans les attributions).
  Instant montré : la zone Nancy est prête, le téléphone est en mode avion.
  On a déplacé la carte : la position est visible mais n'est plus au centre,
  le bouton de recentrage est donc au repos. Zoom 15 environ, quartier de
  Clairlieu (Villers-lès-Nancy), au bord de la forêt de Haye.

  CE QUI EST À L'ÉCRAN, ET RIEN DE PLUS
  - La carte, plein écran, du haut de l'écran jusqu'aux rayures. Pas de barre
    du haut (même principe que l'écran 12). Un dégradé crème sous la barre
    d'état garde l'heure lisible sur une carte sombre.
  - Le style de la carte : design/style-carte.md (couleurs, épaisseurs, ordre).
    Ici au zoom 15 : routes blanches bordées, pistes brunes pleines, sentiers
    en tirets rouges, un escalier en hachures, courbes beiges (maîtresses tous
    les 50 m, cote écrite), ombrage du relief.
    Pas de trottoirs : avant le zoom 16, ils ne sont pas dessinés. Le quartier
    n'a plus aucun tiret rouge (défaut de l'essai 3 corrigé).
  - Ma position : jeton marqueur.position (rond bleu de 32, bord blanc de 3,
    flèche blanche du cap), halo bleu pâle pour la précision. Sans cap connu,
    le rond sans flèche (convention des deux plateformes). Dessinée par
    MapLibre (UserLocation), au-dessus de toute la carte.
  - Bouton « Recentrer sur ma position » : rond de 48 en haut à droite (16 du
    bord), style des boutons posés sur la carte (10, 12). Trois états :
      au repos (montré) : fond hn.creme-clair, viseur hn.brun ;
      carte qui suit ma position : fond hn.brun, viseur hn.creme (comme un
        segment choisi) ; il repasse au repos dès qu'on déplace la carte ;
      position refusée : viseur barré ; toucher ouvre la boîte du système qui
        mène aux réglages de l'app.
    Toucher : la carte glisse sur ma position, au zoom 15 si l'on était plus
    loin, sans changer le zoom si l'on était plus près.
    Phase 7 : le bouton des couches prend cette place (60) et celui-ci descend
    à 120, comme sur l'écran 12. Pas de bouton des couches en phase 2.
  - Attributions, en permanence : « © OpenStreetMap © OpenMapTiles
    © Mapterhorn © IGN », 11 points, hn.brun-2 sur hn.creme-clair à 88 %, en bas
    à gauche, 8 au-dessus des rayures. L'attribution et le logo de MapLibre
    sont désactivés.
  - Barre d'onglets, « Carte » actif, surmontée des rayures.

  GESTES
  - Un doigt pour déplacer, double touche pour zoomer, deux doigts pour
    zoomer (pas obligatoire : le double touche suffit avec des gants).
  - Zoom de 8 à 18. Rotation et inclinaison désactivées : le nord reste en
    haut, donc pas de boussole à afficher (elle sert au suivi, écran 30).

  À L'OUVERTURE
  - Position connue et dans la zone : centrée sur elle, zoom 14, bouton en
    mode « suit ma position ».
  - Sinon : toute la zone à l'écran. (Hors zone : question au Product Owner.)

  Pas sur cet écran (hors phase 2) : itinéraire, circuits, bouton des couches,
  « Nouvel itinéraire ». Pas d'échelle graphique : un élément de moins.
  Valeurs : design/tokens.md. Carte : dessin simplifié en SVG.
-->
<style>
:root{
  --creme:#F4E4C1; --creme-clair:#FBF1DA; --brun:#3A1F0F; --brun-2:#5A3A28;
  --moutarde:#F0A830; --orange:#E2652B; --rouille:#B5452A;
  --ombre:0 2px 8px rgba(58,31,15,.30);
  --position:#1A73E8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:var(--creme)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,"Segoe UI",system-ui,sans-serif;color:var(--brun);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.ecran{position:relative;width:390px;height:844px;overflow:hidden}
svg.carte{position:absolute;left:0;top:0;width:390px;height:752px}
.barre-etat{position:absolute;top:0;left:0;right:0;height:47px;display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 34px;font-size:16px;font-weight:600;z-index:20;color:var(--brun);background:linear-gradient(rgba(244,228,193,.94),rgba(244,228,193,.6))}
.barre-etat .icones{display:flex;gap:6px;align-items:center}
.indicateur{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--creme);z-index:30}

/* Bouton posé sur la carte : hn.creme-clair, hn.bord, hn.ombre */
.flottant{position:absolute;right:16px;width:48px;height:48px;border-radius:24px;background:var(--creme-clair);border:2.5px solid var(--brun);box-shadow:var(--ombre);display:flex;align-items:center;justify-content:center}

/* Ma position : marqueur.position */
.halo{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(26,115,232,.18);border:1px solid rgba(26,115,232,.35)}
.position{position:absolute;width:32px;height:32px;margin:-16px 0 0 -16px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}

/* Attribution : texte.attribution */
.attribution{position:absolute;left:8px;top:727px;font-size:11px;line-height:17px;color:var(--brun-2);background:rgba(251,241,218,.88);padding:0 5px;border-radius:4px}

.rayures-bas{position:absolute;left:0;right:0;bottom:83px;height:9px;background:linear-gradient(var(--moutarde) 0 3px,var(--orange) 3px 6px,var(--rouille) 6px 9px)}
.onglets{position:absolute;left:0;right:0;bottom:0;height:83px;background:var(--brun);display:flex;padding-top:7px}
.onglet{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;font-weight:500;color:var(--creme)}
.pastille{width:64px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.onglet.actif{font-weight:800}
.onglet.actif .pastille{background:var(--moutarde);color:var(--brun)}
</style>
</head>
<body>
<div class="ecran">

<!-- Carte : couleurs carte.*, épaisseurs du zoom 15 (style-carte.md). Ordre de dessin du style. -->
<svg class="carte" viewBox="0 0 390 752" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Carte de la zone Nancy, quartier de Clairlieu et forêt de Haye">
  <defs>
    <filter id="flou" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="18"/></filter>
    <path id="rue-hetres" d="M205 600 C250 590 300 600 400 585"/>
  </defs>

  <!-- 1 fond -->
  <rect x="-10" y="-10" width="420" height="780" fill="#EEEBE4"/>
  <!-- 2 prairie (prés sur le versant) -->
  <path d="M250 250 C300 190 350 120 400 60 L400 390 C330 410 270 440 215 470 C180 440 120 420 90 400 C150 360 200 310 250 250 Z" fill="#E4E9D0"/>
  <!-- 3 forêt (plateau de Haye, et un bois en bas à gauche) -->
  <path d="M-10 -10 H400 V60 C340 120 300 190 250 250 C200 310 150 360 90 400 C50 425 20 440 -10 450 Z" fill="#D3E4C0"/>
  <path d="M-10 600 C40 585 100 590 140 620 C160 660 160 710 150 760 L-10 760 Z" fill="#D3E4C0"/>
  <!-- 4 bâti (quartier) -->
  <path d="M215 470 C270 440 330 410 400 390 L400 760 L190 760 C200 650 205 560 215 470 Z" fill="#E3DCD0"/>
  <!-- 7 ruisseau : carte.eau-trait, 1,2 -->
  <path d="M-10 640 C40 625 90 610 130 600 C160 592 185 580 205 562" fill="none" stroke="#7DB0CB" stroke-width="1.2" stroke-linecap="round"/>
  <!-- 8 ombrage : versant tourné vers le sud-est, à l'ombre (lumière du nord-ouest) -->
  <g filter="url(#flou)" fill="none" stroke="#4A3F35">
    <path d="M-10 362 C90 342 170 312 250 262 S360 192 400 182" stroke-width="110" opacity=".13"/>
  </g>
  <g filter="url(#flou)" fill="none" stroke="#FFFFFF">
    <path d="M-10 230 C90 210 170 180 250 130 S360 60 400 50" stroke-width="70" opacity=".35"/>
  </g>
  <!-- 9 bâtiments : carte.batiment -->
  <g fill="#D6CCBD">
    <rect x="236" y="534" width="14" height="11" transform="rotate(-12 243 540)"/>
    <rect x="254" y="552" width="13" height="12" transform="rotate(-12 260 558)"/>
    <rect x="318" y="548" width="15" height="11" transform="rotate(-12 325 553)"/>
    <rect x="340" y="540" width="14" height="13" transform="rotate(-12 347 546)"/>
    <rect x="356" y="566" width="16" height="11" transform="rotate(-8 364 571)"/>
    <rect x="228" y="616" width="14" height="12" transform="rotate(-6 235 622)"/>
    <rect x="252" y="622" width="13" height="12" transform="rotate(-6 258 628)"/>
    <rect x="276" y="628" width="14" height="11" transform="rotate(-6 283 633)"/>
    <rect x="350" y="608" width="15" height="12" transform="rotate(-6 357 614)"/>
    <rect x="372" y="612" width="13" height="12" transform="rotate(-6 378 618)"/>
    <rect x="352" y="660" width="15" height="12" transform="rotate(-4 359 666)"/>
    <rect x="374" y="662" width="13" height="12" transform="rotate(-4 380 668)"/>
    <rect x="296" y="676" width="14" height="12" transform="rotate(-4 303 682)"/>
    <rect x="300" y="708" width="13" height="12" transform="rotate(-4 306 714)"/>
    <rect x="366" y="700" width="16" height="12" transform="rotate(-4 374 706)"/>
    <rect x="230" y="660" width="14" height="12" transform="rotate(-4 237 666)"/>
    <rect x="252" y="690" width="13" height="12" transform="rotate(-4 258 696)"/>
  </g>
  <!-- 10 courbes (10 m) : carte.courbe, 1 -->
  <g fill="none" stroke="#C9B293" stroke-width="1" stroke-linejoin="round">
    <path d="M-10 300 C90 280 170 250 250 200 S360 130 400 120"/>
    <path d="M-10 324 C90 304 170 274 250 224 S360 154 400 144"/>
    <path d="M-10 344 C90 324 170 294 250 244 S360 174 400 164"/>
    <path d="M-10 362 C90 342 170 312 250 262 S360 192 400 182"/>
    <path d="M-10 398 C90 378 170 348 250 298 S360 228 400 218"/>
    <path d="M-10 418 C90 398 170 368 250 318 S360 248 400 238"/>
    <path d="M-10 442 C90 422 170 392 250 342 S360 272 400 262"/>
    <path d="M-10 472 C90 452 170 422 250 372 S360 302 400 292"/>
  </g>
  <!-- 11 courbes maîtresses (50 m) : carte.courbe-maitresse, 1,8 -->
  <g fill="none" stroke="#B89C78" stroke-width="1.8" stroke-linejoin="round">
    <path d="M-10 272 C90 252 170 222 250 172 S360 102 400 92"/>
    <path d="M-10 380 C90 360 170 330 250 280 S360 210 400 200"/>
    <path d="M-10 508 C90 488 170 458 250 408 S360 338 400 328"/>
  </g>
  <!-- 13 escalier : carte.escalier, 3, hachures 0,9 / 0,9 -->
  <path d="M200 450 C208 466 217 482 228 500" fill="none" stroke="#6B5E52" stroke-width="3" stroke-dasharray="0.9 0.9"/>

  <!-- 15-18 bords des voies : carte.voie-bord -->
  <g fill="none" stroke="#BFB7AA" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 600 L318 626" stroke-width="3.5"/>
    <path d="M372 598 L386 560" stroke-width="3.5"/>
    <path d="M230 505 C270 520 300 560 320 600 C335 640 345 700 350 760" stroke-width="5.5"/>
    <path d="M205 600 C250 590 300 600 400 585" stroke-width="5.5"/>
    <path d="M330 650 L400 640" stroke-width="5.5"/>
    <path d="M238 499 C252 455 265 400 272 360" stroke-width="5.5"/>
    <path d="M150 760 C175 680 195 600 215 540 C235 480 290 450 400 430" stroke-width="7.5"/>
  </g>
  <!-- 19 pistes : carte.piste, 2,5, plein -->
  <g fill="none" stroke="#7A4A1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M272 360 C276 320 268 280 250 250 L190 160 L140 70 L120 -10"/>
    <path d="M-10 210 L190 160 L400 30"/>
    <path d="M-10 90 L140 70 L300 -10"/>
  </g>
  <!-- 20 sentiers : carte.sentier, 2, tirets 5 / 4, bouts carrés -->
  <g fill="none" stroke="#C62828" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="butt" stroke-linejoin="round">
    <path d="M90 185 C100 240 120 290 140 330 C160 370 180 410 200 450"/>
    <path d="M250 250 C290 245 330 225 360 190 C375 170 390 160 410 150"/>
    <path d="M140 330 C110 360 70 380 30 400 C10 410 -5 420 -10 425"/>
    <path d="M-10 680 C30 670 70 690 100 720 C115 735 125 750 130 760"/>
  </g>
  <!-- 21-24 intérieurs des voies : carte.voie -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 600 L318 626" stroke-width="2.25"/>
    <path d="M372 598 L386 560" stroke-width="2.25"/>
    <path d="M230 505 C270 520 300 560 320 600 C335 640 345 700 350 760" stroke-width="3.75"/>
    <path d="M205 600 C250 590 300 600 400 585" stroke-width="3.75"/>
    <path d="M330 650 L400 640" stroke-width="3.75"/>
    <path d="M238 499 C252 455 265 400 272 360" stroke-width="3.75"/>
    <path d="M150 760 C175 680 195 600 215 540 C235 480 290 450 400 430" stroke-width="5.5"/>
  </g>

  <!-- 25-30 étiquettes : Noto Sans dans l'app (ici police du système), halo blanc -->
  <g font-family="'Noto Sans',-apple-system,Roboto,sans-serif" stroke="#FFFFFF" stroke-linejoin="round" paint-order="stroke">
    <!-- cote : carte.cote -->
    <text x="140" y="236" font-size="12.5" fill="#5A3A28" stroke-width="3" transform="rotate(-21 140 236)">400</text>
    <text x="96" y="358" font-size="12.5" fill="#5A3A28" stroke-width="3" transform="rotate(-18 96 358)">350</text>
    <text x="60" y="495" font-size="12.5" fill="#5A3A28" stroke-width="3" transform="rotate(-12 60 495)">300</text>
    <!-- nom de voie : carte.etiquette-2 -->
    <text font-size="12" fill="#4A4A4A" stroke-width="3"><textPath href="#rue-hetres" startOffset="32%">Allée des Hêtres</textPath></text>
    <!-- hameau, quartier : carte.etiquette-2 -->
    <text x="300" y="655" font-size="13" fill="#4A4A4A" stroke-width="3" text-anchor="middle">Clairlieu</text>
  </g>
</svg>

<div class="barre-etat"><span>10:14</span>
  <span class="icones">
    <!-- Mode avion -->
    <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-label="Mode avion"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>
    <svg width="27" height="12" viewBox="0 0 27 12" fill="currentColor"><rect x=".5" y=".5" width="23" height="11" rx="3" fill="none" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="16" height="8" rx="1.5"/><rect x="25" y="4" width="2" height="4" rx="1" opacity=".5"/></svg>
  </span>
</div>

<!-- Ma position : sur la piste de la forêt, cap vers le nord-ouest -->
<div class="halo" style="left:232px;top:223px"></div>
<svg class="position" style="left:232px;top:223px" viewBox="0 0 32 32" aria-label="Ma position"><circle cx="16" cy="16" r="13" fill="#1A73E8" stroke="#fff" stroke-width="3"/><path d="M16 7 L22 21 L16 18 L10 21 Z" fill="#fff" transform="rotate(-34 16 16)"/></svg>

<!-- Recentrer : au repos (la carte ne suit pas ma position) -->
<div class="flottant" style="top:60px" role="button" aria-label="Recentrer sur ma position">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3A1F0F" stroke-width="2.3" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="#3A1F0F"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
</div>

<div class="attribution">© OpenStreetMap © OpenMapTiles © Mapterhorn © IGN</div>

<div class="rayures-bas"></div>
<div class="onglets">
  <div class="onglet actif" aria-current="page"><span class="pastille"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg></span>Carte</div>
  <div class="onglet"><span class="pastille"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.5" fill="currentColor"/><circle cx="4.5" cy="12" r="1.5" fill="currentColor"/><circle cx="4.5" cy="18" r="1.5" fill="currentColor"/></svg></span>Itinéraires</div>
  <div class="onglet"><span class="pastille"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></span>Zones</div>
  <div class="onglet"><span class="pastille"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="8.6" stroke-width="3.2" stroke-dasharray="3.4 3.35"/><circle cx="12" cy="12" r="6" stroke-width="3.4"/></svg></span>Réglages</div>

</div>
</body>
</html>
