<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>RutaPulse – Suivi : réglages pendant le suivi (luminosité)</title>
<!--
  Écran 31b, direction B. Décision 6 du 21 octobre 2026 : sur l'écran de
  navigation, une petite roue dentée ouvre les réglages utiles pendant le
  suivi, la luminosité pour l'instant.
  Instant montré : on a touché la roue dentée de l'écran 30, puis « Maximum ».
  L'écran passe au maximum tout de suite, sans valider.
  - Panneau du bas non bloquant : pas de voile sur la carte, le guidage
    continue (distance, consigne, passage au jaune sous 100 m). Conventions :
    « standard bottom sheet » de Material 3 sur Android ; feuille iOS à hauteur
    moyenne, sans assombrir le fond (largestUndimmedDetent).
  - La carte garde la position visible au-dessus du panneau (marge du bas de
    la caméra MapLibre) ; « Reste » est masqué tant que le panneau est ouvert.
  - Cibles de suivi : segments de 64 de haut, bouton « Fermer » de 64. Textes
    de 20 au moins, en #111111 (18,9:1 sur blanc).
  - Fermer : bouton « Fermer », glisser le panneau vers le bas, ou retour
    d'Android. Retoucher la roue dentée le ferme aussi.
  - Roue dentée en noir tant que le panneau est ouvert : on voit d'où il vient.
  - Même réglage que l'écran Réglages (v1/80-reglages.html) : le choix reste
    pour les sorties suivantes. (Question ouverte, voir LISEZMOI.)
  Pas de rayures ni de crème ici (décision 7) : c'est un écran de navigation.
  Valeurs : design/tokens.md. Carte : la même que l'écran 30, décalée vers le
  haut ; dessin simplifié en SVG.
-->
<style>
:root{
  --fond:#FFFFFF; --texte:#111111; --texte-2:#4A4A4A;
  --contour-flottant:rgba(17,17,17,.35); --ombre:0 2px 8px rgba(0,0,0,.25);
  --itineraire:#C2007A; --position:#1A73E8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:#fff}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,"Segoe UI",system-ui,sans-serif;color:var(--texte);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.ecran{position:relative;width:390px;height:844px;overflow:hidden}
.barre-etat{position:absolute;top:0;left:0;right:0;height:47px;display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 34px;font-size:16px;font-weight:600;z-index:20}
.barre-etat .icones{display:flex;gap:6px;align-items:center}
.indicateur{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#111;z-index:30}

/* Panneau de guidage, état normal (plus de 100 m) */
.guidage{position:absolute;top:0;left:0;right:0;height:262px;background:var(--fond);border-bottom:3px solid #111;padding:51px 16px 0 16px;z-index:10}
.guidage .ligne{display:flex;align-items:center;gap:12px;height:124px}
.guidage .dist{font-size:72px;font-weight:800;line-height:1;letter-spacing:-1px}
.guidage .unite{font-size:40px;font-weight:800;letter-spacing:0}
.guidage .consigne{font-size:28px;font-weight:700;line-height:1.2;margin-top:12px;padding-left:4px}

/* Carte de l'écran 30, remontée de 170 pour garder la position au-dessus du panneau */
svg.carte{position:absolute;left:0;top:92px;width:390px;height:438px}
svg.carte *{vector-effect:non-scaling-stroke}
.courbes{opacity:.5}
.position{position:absolute;left:175px;top:379px;width:40px;height:40px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.halo{position:absolute;left:165px;top:369px;width:60px;height:60px;border-radius:50%;background:rgba(26,115,232,.16)}
.boussole{position:absolute;right:16px;top:280px;width:64px;height:64px;border-radius:32px;background:var(--fond);border:1px solid var(--contour-flottant);box-shadow:var(--ombre);display:flex;align-items:center;justify-content:center}
.reglages{position:absolute;right:24px;top:368px;width:48px;height:48px;border-radius:24px;background:#111;border:1px solid #111;box-shadow:var(--ombre);display:flex;align-items:center;justify-content:center}
.reglages::before{content:"";position:absolute;inset:-8px;border-radius:32px}
.attribution{position:absolute;left:8px;top:430px;font-size:11px;color:#4A4A4A;background:rgba(255,255,255,.75);padding:1px 4px;border-radius:4px}

/* Panneau des réglages du suivi */
.panneau{position:absolute;left:0;right:0;top:452px;bottom:0;background:var(--fond);border-top:3px solid #111;border-radius:28px 28px 0 0;box-shadow:0 -2px 10px rgba(0,0,0,.18);padding:0 16px;z-index:12}
.poignee{position:absolute;top:8px;left:50%;margin-left:-18px;width:36px;height:5px;border-radius:3px;background:#4A4A4A}
.panneau h2{font-size:24px;font-weight:800;line-height:1.2;margin-top:26px;padding-left:4px}
.panneau .etiquette{font-size:20px;font-weight:700;margin-top:18px;padding-left:4px}
.segments{display:flex;height:64px;margin-top:10px;border:3px solid #111;border-radius:32px;overflow:hidden}
.segments div{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;font-size:20px;font-weight:700}
.segments div + div{border-left:3px solid #111}
.segments .choisi{background:#111;color:#fff}
.panneau .explication{font-size:20px;font-weight:400;line-height:1.3;margin-top:14px;padding-left:4px}
.fermer{position:absolute;left:16px;right:16px;top:264px;height:64px;border-radius:32px;border:2px solid #111;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
