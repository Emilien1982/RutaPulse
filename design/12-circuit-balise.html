<!DOCTYPE html>

<title>RutaPulse – Carte : circuit VTT balisé touché</title>
<!--
  Écran 12 (direction B). Fonction 9 du cadrage.
  Instant montré : sur la carte d'accueil, couche des circuits allumée, on a
  touché un circuit. Il passe au premier plan (bleu plein), les autres
  s'effacent, et une feuille du bas propose d'en faire un itinéraire.
  La feuille couvre la barre d'onglets, comme une feuille système.
  Valeurs : design/tokens.md. Carte : dessin simplifié en SVG.
-->
<style>
:root{
  --fond:#FFFFFF; --surface:#F2F2F2; --texte:#111111; --texte-2:#4A4A4A; --separateur:#D0D0D0;
  --contour-flottant:rgba(17,17,17,.35); --ombre:0 2px 8px rgba(0,0,0,.25);
  --action:#0A47A8; --sur-action:#FFFFFF; --circuit:#2F6BFF;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:#fff}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,"Segoe UI",system-ui,sans-serif;color:var(--texte);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.ecran{position:relative;width:390px;height:844px;overflow:hidden}
svg.carte{position:absolute;left:0;top:0;width:390px;height:844px}
svg.carte *{vector-effect:non-scaling-stroke}
.barre-etat{position:absolute;top:0;left:0;right:0;height:47px;display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 34px;font-size:16px;font-weight:600;z-index:20;background:linear-gradient(rgba(255,255,255,.9),rgba(255,255,255,.55))}
.barre-etat .icones{display:flex;gap:6px;align-items:center}
.indicateur{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#111;z-index:30}

.flottant{position:absolute;right:16px;width:48px;height:48px;border-radius:24px;background:var(--fond);border:1px solid var(--contour-flottant);box-shadow:var(--ombre);display:flex;align-items:center;justify-content:center;color:var(--texte)}
.flottant.actif{color:var(--action)}
.flottant .pastille{position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:5px;background:var(--circuit);border:2px solid #fff}
.attribution{position:absolute;left:8px;top:518px;font-size:11px;color:#4A4A4A;background:rgba(255,255,255,.75);padding:1px 4px;border-radius:4px}

.feuille{position:absolute;left:0;right:0;top:540px;bottom:0;background:var(--fond);border-radius:16px 16px 0 0;box-shadow:0 -2px 10px rgba(0,0,0,.2);border-top:1px solid var(--contour-flottant);padding:22px 16px 0}
.poignee{position:absolute;top:8px;left:50%;margin-left:-18px;width:36px;height:5px;border-radius:3px;background:#BDBDBD}
.fermer{position:absolute;top:12px;right:8px;width:48px;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center}
.fermer span{width:32px;height:32px;border-radius:16px;background:var(--surface);display:flex;align-items:center;justify-content:center}
.surtitre{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--texte-2)}
.nom{font-size:24px;font-weight:700;line-height:1.2;margin-top:6px;padding-right:44px}
.infos{font-size:17px;margin-top:6px}
.infos b{font-weight:700}
.explication{font-size:15px;line-height:1.4;color:var(--texte-2);margin-top:12px}
.principal{margin-top:16px;height:56px;border-radius:28px;background:var(--action);color:var(--sur-action);font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px}
.source{font-size:13px;color:var(--texte-2);text-align:center;margin-top:10px}
</style>
</head>
