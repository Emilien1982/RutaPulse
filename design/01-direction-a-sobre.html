<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>RutaPulse – Direction A « sobre, carte dominante » – suivi sur le vélo</title>
<!--
  Direction A : la carte occupe tout l'écran ; la prochaine direction tient
  dans une petite carte sombre posée en haut, comme dans les apps de
  navigation routière.
  Valeurs : design/tokens.md (recopiées ici, ce fichier doit s'ouvrir seul).
  La carte est un dessin simplifié en SVG, pas la vraie carte MapLibre.
-->
<style>
:root{
  --fond:#FFFFFF; --texte:#111111; --texte-2:#4A4A4A;
  --contour-flottant:rgba(17,17,17,.35); --ombre:0 2px 8px rgba(0,0,0,.25);
  --danger:#B3261E; --itineraire:#C2007A; --position:#1A73E8;
  --carte-guidage-sombre:#1C1C1E;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:#fff}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,"Segoe UI",system-ui,sans-serif;color:var(--texte);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.ecran{position:relative;width:390px;height:844px;overflow:hidden}
svg.carte{position:absolute;left:0;top:0;width:390px;height:844px}
svg.carte *{vector-effect:non-scaling-stroke}
.etiquettes,.relief{display:none}
.barre-etat{position:absolute;top:0;left:0;right:0;height:47px;display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 34px;font-size:16px;font-weight:600;z-index:20;background:linear-gradient(rgba(255,255,255,.9),rgba(255,255,255,.6))}
.barre-etat .icones{display:flex;gap:6px;align-items:center}
.indicateur{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#111;z-index:30}

.guidage{position:absolute;top:56px;left:12px;right:12px;height:112px;background:var(--carte-guidage-sombre);color:#fff;border-radius:16px;box-shadow:var(--ombre);display:flex;align-items:center;gap:14px;padding:0 18px}
.guidage .dist{font-size:40px;font-weight:800;line-height:1}
.guidage .consigne{font-size:22px;font-weight:600;line-height:1.2;margin-top:6px}

.position{position:absolute;left:175px;top:554px;width:40px;height:40px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.halo{position:absolute;left:165px;top:544px;width:60px;height:60px;border-radius:50%;background:rgba(26,115,232,.16)}

.bas{position:absolute;left:12px;right:12px;bottom:34px;height:76px;background:var(--fond);border-radius:16px;border:1px solid var(--contour-flottant);box-shadow:var(--ombre);display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 20px}
.bas .etiquette{font-size:15px;color:var(--texte-2);font-weight:600}
.bas .valeur{font-size:28px;font-weight:800;line-height:1.1}
.bouton-rond{width:56px;height:56px;border-radius:28px;background:#F2F2F2;border:1px solid var(--contour-flottant);display:flex;align-items:center;justify-content:center;color:var(--danger)}
.attribution{position:absolute;left:12px;bottom:116px;font-size:11px;color:#4A4A4A;background:rgba(255,255,255,.75);padding:1px 4px;border-radius:4px}
</style>
</head>
<body>
<div class="ecran">

<svg class="carte" viewBox="140.1 -8.7 243.75 527.5" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
<g transform="rotate(13.5 262 350)">
  <!-- Fond de carte simplifié (style de l'essai 3) -->
  <rect x="-400" y="-400" width="1200" height="1700" fill="#EEEBE4"/>

  <g fill="none" stroke-linecap="round">
    <path d="M-60 497 C80 482 150 468 235 470 S340 462 460 430" stroke="#BFB7AA" stroke-width="9"/>
    <path d="M138 -60 C148 120 128 260 150 400 S160 640 190 900" stroke="#BFB7AA" stroke-width="8"/>

    <path d="M138 -60 C148 120 128 260 150 400 S160 640 190 900" stroke="#FFFFFF" stroke-width="5.5"/>
  </g>
  <g class="pistes" fill="none" stroke="#7A4A1E" stroke-width="2.5" stroke-linecap="round">
    <path d="M235 470 C255 440 272 415 270 390 S255 330 250 300"/>

    <path d="M70 250 C66 280 62 305 60 330"/>

    <path d="M190 215 C200 170 215 120 210 60 C208 20 200 -20 205 -60"/>
    <path d="M250 300 C285 292 305 280 322 268"/>
  </g>
  <g class="sentiers" fill="none" stroke="#C62828" stroke-width="2" stroke-dasharray="5 4">
    <path d="M190 215 C150 220 110 235 70 250"/>
    <path d="M210 60 C250 40 290 30 360 10"/>
    <path d="M150 400 C175 385 195 360 205 330 S215 280 230 262"/>
    <path d="M270 390 C290 400 300 410 310 430"/>
  </g>
  <!-- Itinéraire : parcouru en gris, reste en magenta avec liseré blanc -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M175 470 C195 470 215 470 235 470 C255 440 272 415 270 390 C268 375 265 362 262 350" stroke="#8C8C8C" stroke-opacity=".7" stroke-width="8"/>
    <path d="M262 350 C258 335 252 315 250 300 C235 270 215 240 190 215 C150 220 110 235 70 250 C66 280 62 305 60 330 C90 360 120 385 150 400 C151 415 152 430 152 440" stroke="#FFFFFF" stroke-width="16"/>
    <path d="M262 350 C258 335 252 315 250 300 C235 270 215 240 190 215 C150 220 110 235 70 250 C66 280 62 305 60 330 C90 360 120 385 150 400 C151 415 152 430 152 440" stroke="#C2007A" stroke-width="10"/>
  </g>
</g>
</svg>

<div class="barre-etat"><span>10:24</span>
  <span class="icones">
    <svg width="18" height="12" viewBox="0 0 18 12" fill="#111"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity=".3"/></svg>
    <svg width="27" height="12" viewBox="0 0 27 12" fill="#111"><rect x=".5" y=".5" width="23" height="11" rx="3" fill="none" stroke="#111" opacity=".5"/><rect x="2" y="2" width="15" height="8" rx="1.5"/><rect x="25" y="4" width="2" height="4" rx="1" opacity=".5"/></svg>
  </span>
</div>

<!-- Prochaine direction -->
<div class="guidage">
  <svg width="68" height="68" viewBox="0 0 96 96" aria-hidden="true"><path d="M62 88 V50 C62 38 54 32 42 32 H24" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M36 14 L16 32 L36 50" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div>
    <div class="dist">200 m</div>
    <div class="consigne">Tournez à gauche</div>
  </div>
</div>

<div class="halo"></div>
<svg class="position" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="#1A73E8" stroke="#fff" stroke-width="3"/><path d="M20 8 L28.5 28 L20 23.5 L11.5 28 Z" fill="#fff"/></svg>

<div class="attribution">© OpenStreetMap © OpenMapTiles © Mapterhorn</div>

<div class="bas">
  <div>
    <div class="etiquette">Reste</div>
    <div class="valeur">21,3 km</div>
  </div>
  <div class="bouton-rond" aria-label="Terminer le suivi">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </div>
</div>

<div class="indicateur"></div>
</div>
</body>
</html>
