# C14 (phase 6) : créer, enregistrer, retrouver dans la liste, renommer,
# ouvrir les infos, modifier, supprimer, hors ligne. Android : mode avion
# réel (coupé à la fin, même en cas d'échec). iOS : sans mode avion.
# Prérequis : zone Nancy installée. La liste peut contenir d'autres
# itinéraires (et d'autres dates) : le parcours ne s'appuie que sur la ligne du
# haut (la plus récente) et sur les noms qu'il donne lui-même.
# iOS : position du simulateur avant : xcrun simctl location booted set 48.751,5.967
# Pensé pour une version release.
appId: fr.rutapulse.app
onFlowComplete:
  - runFlow:
      when:
        platform: Android
      commands:
        - setAirplaneMode: disabled
---
- runFlow:
    when:
      platform: Android
    commands:
      - setAirplaneMode: enabled
- launchApp:
    clearState: false
    stopApp: true
- runFlow:
    when:
      platform: Android
    commands:
      - setLocation:
          latitude: 48.751
          longitude: 5.967
      - extendedWaitUntil:
          visible:
            id: 'new-route-button'
          timeout: 30000
      - setLocation:
          latitude: 48.751
          longitude: 5.967
      - waitForAnimationToEnd:
          timeout: 4000
- tapOn:
    text: 'Pendant l.utilisation.*|While Using.*|Allow While.*|Lors de l.utilisation.*'
    optional: true
# Création : départ, arrivée. Pas de toucher sur « Carte.* » : il tombe sur la
# carte elle-même et ouvre la feuille d'un circuit (le lancement ouvre la carte).
- extendedWaitUntil:
    visible:
      id: 'new-route-button'
    timeout: 30000
- tapOn:
    id: 'new-route-button'
- extendedWaitUntil:
    visible: 'Touchez le départ sur la carte'
    timeout: 10000
# Avant le 1er point : « Enregistrer » inactif.
- takeScreenshot: 02-creation-enregistrer-inactif
- tapOn:
    point: '50%,50%'
- extendedWaitUntil:
    visible: "Touchez l'arrivée sur la carte"
    timeout: 10000
- tapOn:
    point: '50%,38%'
- extendedWaitUntil:
    visible:
      id: 'route-distance'
      text: '.*[1-9].*'
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: 03-creation-enregistrer-actif
- tapOn:
    id: 'route-save'
# Après « Enregistrer » : l'écran de l'itinéraire s'ouvre, titré par son nom.
- extendedWaitUntil:
    visible:
      id: 'info-modify'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: 'info-title'
    text: 'Itinéraire du .*'
- assertNotVisible:
    id: 'route-save'
# Le nom donné à l'itinéraire (avec sa date, quelle qu'elle soit), échappé
# pour servir de motif.
- copyTextFrom:
    id: 'info-title'
- evalScript: '${output.created = maestro.copiedText}'
- evalScript: "${output.createdRe = output.created.replace(/[().]/g, function (c) { return '\\\\' + c; })}"
- takeScreenshot: 04-infos-apres-enregistrer
# « Retour » mène à la liste : l'itinéraire créé y est.
- tapOn:
    id: 'info-back'
- extendedWaitUntil:
    visible:
      id: 'route-row-.*'
    timeout: 10000
- assertVisible: 'Mes itinéraires'
- assertVisible: '${output.createdRe}.*'
- takeScreenshot: 05-liste-un-itineraire
# Le bouton retour d'Android depuis les infos revient à la liste, sans
# second jeu d'onglets.
- tapOn:
    id: 'route-row-.*'
- extendedWaitUntil:
    visible:
      id: 'info-modify'
    timeout: 10000
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: back
      - waitForAnimationToEnd:
          timeout: 2000
      - assertVisible: 'Mes itinéraires'
      - takeScreenshot: 06-android-retour-vers-liste
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: 'info-back'
      - extendedWaitUntil:
          visible:
            id: 'route-menu-.*'
          timeout: 10000
      - assertVisible: 'Mes itinéraires'
      - takeScreenshot: 06-ios-retour-vers-liste
# Menu « ⋮ », puis Renommer avec un nom vide, puis un nom valide.
- tapOn:
    id: 'route-menu-.*'
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 07-menu
- tapOn:
    text: 'Renommer'
- extendedWaitUntil:
    visible:
      id: 'rename-input'
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 08-renommer
# Nom vide : message, bouton sans effet.
- tapOn:
    id: 'rename-clear'
- tapOn:
    id: 'rename-submit'
- assertVisible:
    id: 'rename-error'
- takeScreenshot: 09-renommer-nom-vide
- inputText: 'Boucle de Haye'
- tapOn:
    id: 'rename-submit'
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: 'Boucle de Haye.*'
- assertNotVisible: '${output.createdRe}.*'
- takeScreenshot: 10-liste-renomme
# Ouvrir les infos : le titre est le nouveau nom.
- tapOn:
    id: 'route-row-.*'
- extendedWaitUntil:
    visible:
      id: 'info-modify'
    timeout: 10000
- assertVisible:
    id: 'info-title'
    text: 'Boucle de Haye'
- assertVisible:
    id: 'info-ascent'
    text: '.*[1-9].*'
- takeScreenshot: 11-infos-titre-nom
# Modifier : ajouter un point par un toucher, enregistrer. (Un glissement par
# Maestro déplace la carte et non le repère : on ajoute un point à la place.)
- tapOn:
    id: 'info-modify'
- extendedWaitUntil:
    visible:
      id: 'route-save'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: 'route-distance'
    text: '.*[1-9].*'
- copyTextFrom:
    id: 'route-distance'
- evalScript: '${output.distBefore = maestro.copiedText}'
- takeScreenshot: 12-modifier-avant
# La carte s'ouvre sur le tracé : le toucher à 60%,32% tombe sur un chemin
# au-delà de l'arrivée (même geste que p07-dupliquer).
- tapOn:
    point: '60%,32%'
- waitForAnimationToEnd:
    timeout: 3000
# Si le point tombe à plus de 200 m d'un chemin, on le relie à la main : le
# tronçon ajouté change quand même la distance.
- runFlow:
    when:
      visible: 'Aucun chemin trouvé'
    commands:
      - tapOn: 'Relier ce point à la main'
- extendedWaitUntil:
    visible:
      id: 'route-distance'
      text: '.*(km|m).*'
    timeout: 60000
# Attendre que la distance change (le calcul du tronçon ajouté).
- extendedWaitUntil:
    notVisible:
      id: 'route-distance'
      text: '${output.distBefore}'
    timeout: 60000
- copyTextFrom:
    id: 'route-distance'
- evalScript: '${output.distAfter = maestro.copiedText}'
- assertTrue:
    condition: ${output.distAfter != output.distBefore}
    label: 'Le point ajouté change la distance'
- takeScreenshot: 13-modifier-apres-ajout
- tapOn:
    id: 'route-save'
# On revient au même écran, relu : même nom, nouvelle distance.
- extendedWaitUntil:
    visible:
      id: 'info-modify'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: 'info-title'
    text: 'Boucle de Haye'
- assertVisible:
    id: 'info-distance'
    text: '.*(km|m).*'
- assertNotVisible:
    id: 'route-save'
- takeScreenshot: 14-infos-apres-modification
- tapOn:
    id: 'info-back'
- extendedWaitUntil:
    visible:
      id: 'route-row-.*'
    timeout: 10000
# L'itinéraire modifié remplace l'ancienne version : même nom, nouvelle
# distance, et plus l'ancienne.
- assertVisible: 'Boucle de Haye, ${output.distAfter}.*'
- assertNotVisible: 'Boucle de Haye, ${output.distBefore}.*'
- takeScreenshot: 15-liste-apres-modification
# Importer un GPX posé dans Download (sélecteur du système).
- tapOn:
    id: 'routes-import'
- extendedWaitUntil:
    visible: '.*Downloads.*|.*Téléchargements.*|trace-testeur.gpx|Sur mon iPhone'
    timeout: 15000
# Le sélecteur peut lister d'autres fichiers avant : on fait défiler.
- scrollUntilVisible:
    element:
      text: 'trace-testeur.gpx'
    timeout: 20000
- takeScreenshot: 16-selecteur-de-fichier
# iOS : le sélecteur ne réagit pas au toucher sur le nom du fichier, on
# touche sa vignette (première case de la grille « Sur mon iPhone »).
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: 'trace-testeur.gpx'
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          point: '18%,29%'
# Après un import réussi, l'écran Infos du GPX s'ouvre.
- extendedWaitUntil:
    visible:
      id: 'info-title'
    timeout: 20000
- assertVisible:
    id: 'info-title'
    text: 'Trace du testeur'
# (« Modifier » y est ou non selon que la trace est dans la zone : pas testé ici,
# voir p07-gpx-modifier.)
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 17-infos-gpx-importe
- tapOn:
    id: 'info-back'
- extendedWaitUntil:
    visible:
      id: 'route-row-.*'
    timeout: 10000
- assertVisible: 'Trace du testeur.*'
- assertVisible: 'Boucle de Haye.*'
- assertVisible: '.*GPX importé le.*'
- takeScreenshot: 18-liste-avec-gpx
# Supprimer, avec confirmation : d'abord le GPX (en haut), puis l'autre.
- tapOn:
    id: 'route-menu-.*'
- tapOn:
    text: 'Supprimer'
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: 'Supprimer.{1,3}Trace du testeur.*'
- takeScreenshot: 19-confirmation-suppression
- tapOn:
    text: 'Supprimer'
- waitForAnimationToEnd:
    timeout: 2000
- assertNotVisible: 'Trace du testeur.*'
- assertVisible: 'Boucle de Haye.*'
- tapOn:
    id: 'route-menu-.*'
- tapOn:
    text: 'Supprimer'
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 20-confirmation-suppression-2
- tapOn:
    text: 'Supprimer'
- waitForAnimationToEnd:
    timeout: 2000
- assertNotVisible: 'Boucle de Haye.*'
- takeScreenshot: 21-liste-apres-suppression
